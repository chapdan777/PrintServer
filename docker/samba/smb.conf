[global]
    workgroup = WORKGROUP
    server string = Production Print Server
    server role = standalone server
    security = user
    map to guest = Never

    server min protocol = SMB2

    printing = cups
    printcap name = cups
    printcap cache time = 60
    cups server = 127.0.0.1:631
    load printers = yes

    disable spoolss = no

    log file = /var/log/samba/log.%m
    max log size = 1000

[printers]
    comment = CUPS Printers
    path = /var/spool/samba
    browseable = yes
    printable = yes
    guest ok = no
    read only = yes

    cups options = raw

[print$]
    comment = Windows Printer Drivers
    path = /var/lib/samba/printers
    browseable = yes
    read only = yes
    guest ok = no

    write list = printadmin
    create mask = 0664
    directory mask = 0775
